<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spawnify Games — where every idea spawns</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --hover-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 80%);
        }

        /* Main Hero Section */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInDown 1s ease-out;
            letter-spacing: -1px;
        }

        p.subtitle {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out;
            font-weight: 400;
        }

        /* Bottom Buttons */
        .social-container {
            padding: 3rem 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 1.5s ease-out;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--card-bg);
            color: var(--text);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .social-btn:hover {
            background: var(--hover-bg);
            transform: translateY(-4px);
        }

        /* Custom Hover Colors */
        .social-btn.roblox:hover { 
            border-color: #ffffff; 
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15); 
        }
        .social-btn.discord:hover { 
            border-color: #5865F2; 
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.25); 
        }
        .social-btn.youtube:hover { 
            border-color: #FF0000; 
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.25); 
        }

        .social-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            p.subtitle { font-size: 1.2rem; }
            .social-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <main>
        <h1>Spawnify Games</h1>
        <p class="subtitle">where every idea spawns</p>
    </main>
