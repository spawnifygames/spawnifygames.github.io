    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      a {
        text-decoration: none;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;

        display: flex;
        flex-direction: column;
        background: #f5f5f5;

      .content {
        flex: 1;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }

      .content h1 {

        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background-color: #111111;
        border-radius: 8px;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      .btn:hover {
        background-color: #333333;
      }

      .btn:active {
        transform: scale(0.98);
      }
